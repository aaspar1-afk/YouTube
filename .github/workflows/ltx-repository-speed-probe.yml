name: LTX bounded repository speed probe
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: tms-ltx-speed-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download at most 1 GiB in memory
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: python
        run: |
          import concurrent.futures,json,os,time,urllib.request,urllib.parse
          token=os.environ["HF_TOKEN"]
          if not token: raise SystemExit("HF_TOKEN secret is missing")
          repo="Lightricks/LTX-2.5"; revision="49b093a39c19169a8a81721dcc541e07e945232f"
          files=[("diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors",21504034224),("text_encoders/gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors",15372969374)]
          class Redirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):
            if urllib.parse.urlsplit(newurl).scheme!="https":raise RuntimeError("Insecure redirect")
            r=super().redirect_request(req,fp,code,msg,headers,newurl)
            if r is not None and urllib.parse.urlsplit(newurl).hostname!="huggingface.co":r.remove_header("Authorization")
            return r
          def fetch(task):
           path,total,start,size=task;at=time.monotonic();count=0
           headers={"Authorization":"Bearer "+token,"Range":f"bytes={start}-{start+size-1}","Accept-Encoding":"identity","User-Agent":"TMS-bounded-cloud-speed-probe"}
           url=f"https://huggingface.co/{repo}/resolve/{revision}/{path}?download=true&tms_probe={start}-{size}"
           try:
            with urllib.request.build_opener(Redirect()).open(urllib.request.Request(url,headers=headers),timeout=45) as r:
             if r.status!=206 or r.headers.get("Content-Range")!=f"bytes {start}-{start+size-1}/{total}":raise RuntimeError("Range rejected; no body consumed")
             connected=time.monotonic()
             while count<size:
              block=r.read(min(1024**2,size-count))
              if not block:break
              count+=len(block)
             elapsed=time.monotonic()-at
             return dict(file=path,bytes=count,seconds=round(elapsed,4),connection_seconds=round(connected-at,4),MB_s=round(count/1e6/elapsed,2),complete=count==size)
           except Exception as e:return dict(file=path,bytes=count,error_type=type(e).__name__,http_status=getattr(e,"code",None))
          M=1024**2
          single=[]
          at=time.monotonic()
          tasks=[(path,total,0,512*M) for path,total in files]
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:parallel=list(pool.map(fetch,tasks))
          seconds=time.monotonic()-at
          received=sum(r["bytes"] for r in single+parallel)
          assert received<=1024*M
          report=dict(repo=repo,revision=revision,runner="GitHub ubuntu-24.04 standard",single=single,parallel=parallel,parallel_seconds=round(seconds,4),parallel_MB_s=round(sum(r["bytes"] for r in parallel)/1e6/seconds,2),received_bytes=received,limit_bytes=1024*M,weights_retained=False,retries=0,B2_used=False,GPU_used=False)
          print(json.dumps(report,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:summary.write("### Bounded LTX speed probe\n\n```json\n"+json.dumps(report,indent=2)+"\n```\n")
          if not all(r.get("complete") for r in single+parallel):raise SystemExit("Probe incomplete; inspect safe status fields")
          
